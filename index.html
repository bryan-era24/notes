<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1A2433" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Notas de pedido para el punto de venta" />
    <title>Notas</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/print.css" />
    <style id="page-size"></style>
  </head>
  <body>
    <a class="skip" href="#view" data-i18n="app.skip"></a>
    <div class="app" id="app">
      <header class="topbar">
        <a class="brand" href="#/pedidos" id="brand"></a>
        <p class="sync" id="sync-status" role="status" aria-live="polite"></p>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
      <nav class="tabs" id="tabs" aria-label="Secciones">
        <a href="#/pedidos" data-tab="orders"
          ><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z M9 9h6 M9 13h6 M9 17h4" /></svg
          ><span data-i18n="nav.orders"></span
        ></a>
        <a href="#/produccion" data-tab="production"
          ><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20h16 M6 20v-6l3-2v8 M11 20v-9l3-2v11 M16 20V8l3-2v14" /></svg
          ><span data-i18n="nav.production"></span
        ></a>
        <a href="#/reportes" data-tab="reports"
          ><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4v16h16 M8 16l4-5 3 3 5-7" /></svg><span data-i18n="nav.reports"></span
        ></a>
        <a href="#/catalogo" data-tab="catalog"
          ><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7l8-4 8 4-8 4z M4 7v10l8 4 8-4V7 M12 11v10" /></svg
          ><span data-i18n="nav.catalog"></span
        ></a>
        <a href="#/ajustes" data-tab="settings"
          ><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h10 M18 7h2 M4 17h4 M12 17h8 M16 5v4 M10 15v4" /></svg
          ><span data-i18n="nav.settings"></span
        ></a>
      </nav>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <div id="print-root" aria-hidden="true"></div>
    <input type="file" id="import-file" accept="application/json,.json" hidden />

    <script src="js/config.js"></script>
    <script src="js/log.js"></script>
    <script src="js/prefs.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/lang/es.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/print.js"></script>
    <script src="js/escpos.js"></script>
    <script src="js/printers.js"></script>
    <script src="backend/remote.js"></script>
    <script src="backend/rows.js"></script>
    <script src="backend/sync.js"></script>
    <script src="backend/connection.js"></script>
    <script src="backend/store.js"></script>
    <script src="backend/store.local.js"></script>
    <script src="backend/store.synced.js"></script>
    <script src="backend/schema_sql.js"></script>
    <script src="js/repo.js"></script>
    <script src="js/demo.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
